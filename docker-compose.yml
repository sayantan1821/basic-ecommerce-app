services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-basic_ecommerce}
      POSTGRES_USER: ${POSTGRES_USER:-basic_ecommerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-basic_ecommerce_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-basic_ecommerce} -d ${POSTGRES_DB:-basic_ecommerce}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-basic_ecommerce}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-basic_ecommerce}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-basic_ecommerce_dev}
      DEMO_API_TOKEN: ${DEMO_API_TOKEN:-local-demo-token}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:8080}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_DEMO_API_TOKEN: ${DEMO_API_TOKEN:-local-demo-token}
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
